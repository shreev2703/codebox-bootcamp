<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeBox Users</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090a;
      --panel: #0e1311;
      --panel-2: #141b18;
      --border: #1f2a25;
      --text: #e8f0ec;
      --muted: #8a9a92;
      --accent: #34d399;
      --accent-hover: #6ee7b7;
      --accent-glow: rgba(52, 211, 153, 0.25);
      --danger: #f87171;
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 480px at 50% -12%, rgba(52, 211, 153, 0.14), transparent 60%),
        var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    .container { max-width: 1040px; margin: 0 auto; padding: 48px 20px 64px; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }

    .brand { display: flex; align-items: center; gap: 14px; }

    .logo {
      width: 46px;
      height: 46px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 18px;
      color: #04130c;
      background: linear-gradient(135deg, #a7f3d0, #10b981);
      box-shadow: 0 0 28px var(--accent-glow);
    }

    h1 { font-size: 24px; margin: 0; letter-spacing: -0.02em; }
    .subtitle { margin: 3px 0 0; color: var(--muted); font-size: 14px; }

    .header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    .status,
    .account {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 13px;
      color: var(--muted);
      background: var(--panel);
    }

    .account { padding: 4px 4px 4px 14px; }
    .account strong { color: var(--text); font-weight: 600; }

    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .status.online .dot { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
    .status.offline .dot { background: var(--danger); }

    .layout {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
    }

    .card h2 { font-size: 17px; margin: 0 0 4px; letter-spacing: -0.01em; }
    .hint { color: var(--muted); font-size: 13px; margin: 0 0 20px; line-height: 1.5; }

    .tabs {
      display: flex;
      gap: 4px;
      padding: 4px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel-2);
    }

    .tab {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-weight: 500;
    }

    .tab:hover { color: var(--text); }
    .tab.active { background: var(--panel); color: var(--text); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35); }

    .field { margin-bottom: 14px; }
    label { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }

    input {
      width: 100%;
      padding: 11px 13px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      font: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input::placeholder { color: #5b6a63; }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

    button { font: inherit; cursor: pointer; border-radius: 10px; transition: background 0.15s, border-color 0.15s, color 0.15s; }

    .form-actions { display: flex; gap: 10px; margin-top: 8px; }

    .btn-primary {
      flex: 1;
      padding: 11px 16px;
      border: none;
      background: var(--accent);
      color: #04130c;
      font-weight: 600;
    }

    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.6; cursor: default; }

    .btn-ghost {
      padding: 11px 16px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
    }

    .btn-ghost:hover { border-color: var(--muted); }

    .btn-small {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--panel-2);
      color: var(--text);
      font-size: 13px;
    }

    .btn-small:hover { border-color: var(--muted); }

    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .count { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
    .search { width: 220px; }

    .user-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; }

    .user {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid transparent;
      transition: background 0.15s, border-color 0.15s;
    }

    .user:hover { background: var(--panel-2); }
    .user.editing { background: var(--panel-2); border-color: var(--accent); }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 600;
      font-size: 14px;
      flex-shrink: 0;
    }

    .info { flex: 1; min-width: 0; }
    .name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta { color: var(--muted); font-size: 13px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .you {
      margin-left: 6px;
      padding: 1px 7px;
      border-radius: 999px;
      background: rgba(52, 211, 153, 0.12);
      color: var(--accent);
      font-size: 11px;
      font-weight: 600;
      vertical-align: 2px;
    }

    .row-actions { display: flex; align-items: center; gap: 4px; }

    .icon-btn {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
    }

    .icon-btn:hover { background: var(--panel); border-color: var(--border); color: var(--text); }
    .icon-btn.danger:hover { color: var(--danger); }

    .confirm-btn {
      padding: 7px 12px;
      border: 1px solid var(--danger);
      background: rgba(248, 113, 113, 0.12);
      color: var(--danger);
      font-size: 13px;
      font-weight: 600;
    }

    .confirm-btn:hover { background: rgba(248, 113, 113, 0.22); }

    .state { text-align: center; padding: 44px 16px; color: var(--muted); font-size: 14px; }
    .state strong { display: block; color: var(--text); font-size: 15px; margin-bottom: 6px; }
    .state.error strong { color: var(--danger); }
    .state .btn-ghost { margin-top: 16px; }

    .skeleton .avatar,
    .bar {
      background: linear-gradient(90deg, var(--panel-2) 0%, #1c2621 50%, var(--panel-2) 100%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite linear;
    }

    .bar { height: 10px; border-radius: 6px; }
    .bar.short { width: 35%; }
    .bar.long { width: 60%; margin-top: 9px; }

    @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

    #toasts {
      position: fixed;
      right: 20px;
      bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }

    .toast {
      padding: 12px 16px;
      border-radius: 10px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      font-size: 14px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      animation: slide-in 0.2s ease-out;
    }

    .toast.error { border-left-color: var(--danger); }

    @keyframes slide-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    footer { margin-top: 40px; text-align: center; color: #5b6a63; font-size: 13px; }

    @media (max-width: 820px) {
      .layout { grid-template-columns: minmax(0, 1fr); }
      .search { width: 100%; }
      .container { padding: 32px 16px 48px; }
      #toasts { left: 16px; right: 16px; bottom: 16px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="logo">Cb</div>
        <div>
          <h1>CodeBox Users</h1>
          <p class="subtitle">Manage users stored in MongoDB Atlas</p>
        </div>
      </div>
      <div class="header-right">
        <div class="status" id="status"><span class="dot"></span><span id="status-text">Checking server...</span></div>
        <div class="account" id="account" hidden>
          <span>Signed in as <strong id="account-name"></strong></span>
          <button type="button" class="btn-small" id="logout-btn">Log out</button>
        </div>
      </div>
    </header>

    <main class="layout">
      <section class="card" id="auth-card">
        <div class="tabs">
          <button type="button" class="tab active" data-mode="login">Log in</button>
          <button type="button" class="tab" data-mode="register">Sign up</button>
        </div>
        <h2 id="auth-title">Welcome back</h2>
        <p class="hint" id="auth-hint">Log in to add, edit and delete users.</p>
        <form id="auth-form">
          <div class="field" id="auth-name-field" hidden>
            <label for="auth-name">Name</label>
            <input id="auth-name" placeholder="Alex Smith" autocomplete="name">
          </div>
          <div class="field">
            <label for="auth-email">Email</label>
            <input id="auth-email" type="email" placeholder="you@example.com" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="auth-password">Password</label>
            <input id="auth-password" type="password" placeholder="At least 8 characters" autocomplete="current-password" minlength="8" required>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn-primary" id="auth-submit">Log in</button>
          </div>
        </form>
      </section>

      <section class="card" id="user-card" hidden>
        <h2 id="form-title">Add a user</h2>
        <p class="hint" id="form-hint">Name and email are required. Emails must be unique.</p>
        <form id="user-form">
          <div class="field">
            <label for="name">Name</label>
            <input id="name" placeholder="Alex Smith" required>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="alex@example.com" required>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn-primary" id="submit-btn">Add user</button>
            <button type="button" class="btn-ghost" id="cancel-btn" hidden>Cancel</button>
          </div>
        </form>
      </section>

      <section class="card">
        <div class="list-header">
          <div>
            <h2>Users</h2>
            <p class="count" id="count"></p>
          </div>
          <input class="search" id="search" type="search" placeholder="Search by name or email">
        </div>
        <ul class="user-list" id="user-list"></ul>
      </section>
    </main>

    <footer>Node.js &middot; Express &middot; MongoDB Atlas &middot; JWT auth</footer>
  </div>

  <div id="toasts"></div>

  <script>
    const isLocal = location.protocol === "file:" || ["localhost", "127.0.0.1"].includes(location.hostname);
    const API_URL = isLocal ? "http://localhost:3000/api" : "/api";
    const SESSION_KEY = "codebox-session";

    const authCard = document.getElementById("auth-card");
    const authForm = document.getElementById("auth-form");
    const authTabs = document.querySelectorAll(".tab");
    const authTitle = document.getElementById("auth-title");
    const authHint = document.getElementById("auth-hint");
    const authNameField = document.getElementById("auth-name-field");
    const authName = document.getElementById("auth-name");
    const authEmail = document.getElementById("auth-email");
    const authPassword = document.getElementById("auth-password");
    const authSubmit = document.getElementById("auth-submit");
    const accountEl = document.getElementById("account");
    const accountName = document.getElementById("account-name");
    const logoutBtn = document.getElementById("logout-btn");

    const userCard = document.getElementById("user-card");
    const form = document.getElementById("user-form");
    const nameInput = document.getElementById("name");
    const emailInput = document.getElementById("email");
    const submitBtn = document.getElementById("submit-btn");
    const cancelBtn = document.getElementById("cancel-btn");
    const formTitle = document.getElementById("form-title");
    const formHint = document.getElementById("form-hint");
    const listEl = document.getElementById("user-list");
    const countEl = document.getElementById("count");
    const searchInput = document.getElementById("search");
    const statusEl = document.getElementById("status");
    const statusText = document.getElementById("status-text");
    const toastsEl = document.getElementById("toasts");

    const icons = {
      edit: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
      trash: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>',
      close: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>',
    };

    let users = [];
    let loaded = false;
    let editingId = null;
    let authMode = "login";
    let session = loadSession();

    function loadSession() {
      try {
        const saved = JSON.parse(localStorage.getItem(SESSION_KEY));
        if (!saved) return null;
        const payload = JSON.parse(atob(saved.token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")));
        return payload.exp * 1000 > Date.now() ? saved : null;
      } catch {
        return null;
      }
    }

    function saveSession(value) {
      session = value;
      try {
        if (value) localStorage.setItem(SESSION_KEY, JSON.stringify(value));
        else localStorage.removeItem(SESSION_KEY);
      } catch {}
      renderAuth();
    }

    function authHeaders() {
      return session ? { Authorization: `Bearer ${session.token}` } : {};
    }

    function checkUnauthorized(res) {
      if (res.status === 401) {
        saveSession(null);
        throw new Error("Your session expired. Please log in again.");
      }
    }

    function initials(name) {
      return name.split(/\s+/).filter(Boolean).slice(0, 2).map((part) => part[0].toUpperCase()).join("");
    }

    function hueFor(text) {
      let hue = 0;
      for (const char of text) hue = (hue * 31 + char.charCodeAt(0)) % 360;
      return hue;
    }

    function formatDate(value) {
      return new Date(value).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
    }

    function showToast(text, type = "success") {
      const toast = document.createElement("div");
      toast.className = `toast ${type}`;
      toast.textContent = text;
      toastsEl.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    function friendlyError(err) {
      return err.message === "Failed to fetch" ? "Could not reach the server." : err.message;
    }

    async function checkHealth() {
      try {
        const res = await fetch(`${API_URL}/health`);
        statusEl.className = res.ok ? "status online" : "status offline";
        statusText.textContent = res.ok ? "Server online, database connected" : "Database disconnected";
      } catch {
        statusEl.className = "status offline";
        statusText.textContent = "Server offline";
      }
    }

    function setAuthMode(mode) {
      authMode = mode;
      const isRegister = mode === "register";
      authTabs.forEach((tab) => tab.classList.toggle("active", tab.dataset.mode === mode));
      authNameField.hidden = !isRegister;
      authName.required = isRegister;
      authTitle.textContent = isRegister ? "Create an account" : "Welcome back";
      authHint.textContent = isRegister
        ? "Sign up to start managing users. Your account shows up in the list."
        : "Log in to add, edit and delete users.";
      authSubmit.textContent = isRegister ? "Create account" : "Log in";
      authPassword.autocomplete = isRegister ? "new-password" : "current-password";
    }

    function renderAuth() {
      const loggedIn = Boolean(session);
      authCard.hidden = loggedIn;
      userCard.hidden = !loggedIn;
      accountEl.hidden = !loggedIn;
      accountName.textContent = loggedIn ? session.user.name : "";
      if (!loggedIn && editingId) resetForm();
      if (loaded) renderUsers();
    }

    function renderSkeleton() {
      countEl.textContent = "Loading...";
      listEl.innerHTML = "";
      for (let i = 0; i < 3; i++) {
        const li = document.createElement("li");
        li.className = "user skeleton";
        li.innerHTML = '<div class="avatar"></div><div class="info"><div class="bar short"></div><div class="bar long"></div></div>';
        listEl.appendChild(li);
      }
    }

    function renderState(title, text, isError = false) {
      listEl.innerHTML = "";
      const li = document.createElement("li");
      li.className = isError ? "state error" : "state";
      const strong = document.createElement("strong");
      strong.textContent = title;
      li.append(strong, text);

      if (isError) {
        const retry = document.createElement("button");
        retry.className = "btn-ghost";
        retry.textContent = "Try again";
        retry.addEventListener("click", loadUsers);
        li.append(document.createElement("br"), retry);
      }
      listEl.appendChild(li);
    }

    function renderUsers() {
      const query = searchInput.value.trim().toLowerCase();
      const visible = users.filter(
        (u) => u.name.toLowerCase().includes(query) || u.email.toLowerCase().includes(query)
      );

      countEl.textContent = `${users.length} ${users.length === 1 ? "user" : "users"}`;
      listEl.innerHTML = "";

      if (users.length === 0) {
        return renderState("No users yet", session ? "Add your first user with the form." : "Sign up to add the first one.");
      }
      if (visible.length === 0) {
        return renderState("No matches", `Nothing matches "${searchInput.value.trim()}".`);
      }
      for (const user of visible) {
        listEl.appendChild(userRow(user));
      }
    }

    function userRow(user) {
      const li = document.createElement("li");
      li.className = user._id === editingId ? "user editing" : "user";

      const hue = hueFor(user.name);
      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = initials(user.name);
      avatar.style.background = `hsl(${hue} 45% 18%)`;
      avatar.style.color = `hsl(${hue} 75% 72%)`;

      const info = document.createElement("div");
      info.className = "info";
      const name = document.createElement("div");
      name.className = "name";
      name.textContent = user.name;
      if (session && session.user.id === user._id) {
        const you = document.createElement("span");
        you.className = "you";
        you.textContent = "You";
        name.appendChild(you);
      }
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = `${user.email} · Joined ${formatDate(user.createdAt)}`;
      info.append(name, meta);

      li.append(avatar, info);

      if (session) {
        const actions = document.createElement("div");
        actions.className = "row-actions";
        showRowButtons(actions, user);
        li.appendChild(actions);
      }
      return li;
    }

    function showRowButtons(actions, user) {
      actions.innerHTML = "";

      const editBtn = document.createElement("button");
      editBtn.className = "icon-btn";
      editBtn.title = "Edit";
      editBtn.setAttribute("aria-label", `Edit ${user.name}`);
      editBtn.innerHTML = icons.edit;
      editBtn.addEventListener("click", () => startEdit(user));

      const deleteBtn = document.createElement("button");
      deleteBtn.className = "icon-btn danger";
      deleteBtn.title = "Delete";
      deleteBtn.setAttribute("aria-label", `Delete ${user.name}`);
      deleteBtn.innerHTML = icons.trash;
      deleteBtn.addEventListener("click", () => askDelete(actions, user));

      actions.append(editBtn, deleteBtn);
    }

    function askDelete(actions, user) {
      actions.innerHTML = "";

      const confirmBtn = document.createElement("button");
      confirmBtn.className = "confirm-btn";
      confirmBtn.textContent = "Delete";

      const keepBtn = document.createElement("button");
      keepBtn.className = "icon-btn";
      keepBtn.title = "Cancel";
      keepBtn.setAttribute("aria-label", "Cancel delete");
      keepBtn.innerHTML = icons.close;

      const timer = setTimeout(() => showRowButtons(actions, user), 5000);
      confirmBtn.addEventListener("click", () => {
        clearTimeout(timer);
        deleteUser(user);
      });
      keepBtn.addEventListener("click", () => {
        clearTimeout(timer);
        showRowButtons(actions, user);
      });

      actions.append(confirmBtn, keepBtn);
    }

    function startEdit(user) {
      editingId = user._id;
      nameInput.value = user.name;
      emailInput.value = user.email;
      formTitle.textContent = "Edit user";
      formHint.textContent = `Updating ${user.name}. Save to apply your changes.`;
      submitBtn.textContent = "Save changes";
      cancelBtn.hidden = false;
      nameInput.focus();
      renderUsers();
    }

    function resetForm() {
      editingId = null;
      form.reset();
      formTitle.textContent = "Add a user";
      formHint.textContent = "Name and email are required. Emails must be unique.";
      submitBtn.textContent = "Add user";
      cancelBtn.hidden = true;
    }

    function stopEdit() {
      resetForm();
      renderUsers();
    }

    async function loadUsers() {
      renderSkeleton();
      checkHealth();
      try {
        const res = await fetch(`${API_URL}/users`);
        if (!res.ok) throw new Error(`Server responded with ${res.status}`);
        users = await res.json();
        loaded = true;
        renderUsers();
      } catch {
        countEl.textContent = "";
        renderState("Can't reach the server", "Make sure the backend is running on port 3000.", true);
      }
    }

    async function deleteUser(user) {
      try {
        const res = await fetch(`${API_URL}/users/${user._id}`, { method: "DELETE", headers: authHeaders() });
        checkUnauthorized(res);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Could not delete user");

        users = users.filter((u) => u._id !== user._id);
        if (editingId === user._id) stopEdit();
        else renderUsers();
        showToast(`Deleted ${user.name}`);
      } catch (err) {
        showToast(friendlyError(err), "error");
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const isEdit = Boolean(editingId);
      const label = submitBtn.textContent;
      submitBtn.disabled = true;
      submitBtn.textContent = "Saving...";

      try {
        const res = await fetch(isEdit ? `${API_URL}/users/${editingId}` : `${API_URL}/users`, {
          method: isEdit ? "PUT" : "POST",
          headers: { "Content-Type": "application/json", ...authHeaders() },
          body: JSON.stringify({ name: nameInput.value.trim(), email: emailInput.value.trim() }),
        });
        checkUnauthorized(res);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Request failed");

        if (isEdit) {
          users = users.map((u) => (u._id === data._id ? data : u));
        } else {
          users.push(data);
        }
        submitBtn.textContent = label;
        stopEdit();
        showToast(isEdit ? `Updated ${data.name}` : `Added ${data.name}`);
      } catch (err) {
        submitBtn.textContent = session ? label : "Add user";
        showToast(friendlyError(err), "error");
      } finally {
        submitBtn.disabled = false;
      }
    });

    authForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const isRegister = authMode === "register";
      const label = authSubmit.textContent;
      authSubmit.disabled = true;
      authSubmit.textContent = isRegister ? "Creating account..." : "Logging in...";

      try {
        const body = { email: authEmail.value.trim(), password: authPassword.value };
        if (isRegister) body.name = authName.value.trim();

        const res = await fetch(`${API_URL}/auth/${isRegister ? "register" : "login"}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Something went wrong");

        authForm.reset();
        setAuthMode("login");
        saveSession(data);
        showToast(isRegister ? `Welcome, ${data.user.name}` : `Logged in as ${data.user.name}`);
        if (isRegister) loadUsers();
      } catch (err) {
        showToast(friendlyError(err), "error");
      } finally {
        authSubmit.disabled = false;
        authSubmit.textContent = label;
      }
    });

    authTabs.forEach((tab) => tab.addEventListener("click", () => setAuthMode(tab.dataset.mode)));
    logoutBtn.addEventListener("click", () => {
      saveSession(null);
      showToast("Logged out");
    });
    cancelBtn.addEventListener("click", stopEdit);
    searchInput.addEventListener("input", renderUsers);

    renderAuth();
    loadUsers();
    setInterval(checkHealth, 10000);
  </script>
</body>
</html>
