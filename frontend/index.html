<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeBox Users</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
    form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
    input { padding: 6px 8px; flex: 1; min-width: 140px; }
    button { padding: 6px 12px; }
    ul { padding-left: 0; list-style: none; }
    li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #eee; }
    li span { flex: 1; }
    .error { color: #b00020; }
    .muted { color: #666; }
  </style>
</head>
<body>
  <h1>CodeBox Users</h1>

  <form id="user-form">
    <input id="name" placeholder="Name" required>
    <input id="email" type="email" placeholder="Email" required>
    <button type="submit" id="submit-btn">Add user</button>
    <button type="button" id="cancel-btn" hidden>Cancel</button>
  </form>
  <p id="form-message"></p>

  <div id="status" class="muted">Loading...</div>
  <ul id="user-list"></ul>

  <script>
    const API_URL = "http://localhost:3000/api/users";
    const statusEl = document.getElementById("status");
    const listEl = document.getElementById("user-list");
    const form = document.getElementById("user-form");
    const nameInput = document.getElementById("name");
    const emailInput = document.getElementById("email");
    const submitBtn = document.getElementById("submit-btn");
    const cancelBtn = document.getElementById("cancel-btn");
    const formMessage = document.getElementById("form-message");

    let editingId = null;

    function showMessage(text, isError) {
      formMessage.textContent = text;
      formMessage.className = isError ? "error" : "";
    }

    function friendlyError(err) {
      return err.message === "Failed to fetch" ? "Could not reach the backend." : err.message;
    }

    function startEdit(user) {
      editingId = user._id;
      nameInput.value = user.name;
      emailInput.value = user.email;
      submitBtn.textContent = "Save changes";
      cancelBtn.hidden = false;
      showMessage(`Editing ${user.name}`, false);
    }

    function stopEdit() {
      editingId = null;
      form.reset();
      submitBtn.textContent = "Add user";
      cancelBtn.hidden = true;
    }

    async function deleteUser(user) {
      if (!confirm(`Delete ${user.name}?`)) return;
      try {
        const res = await fetch(`${API_URL}/${user._id}`, { method: "DELETE" });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Could not delete user");
        if (editingId === user._id) stopEdit();
        showMessage(`Deleted ${user.name}`, false);
        loadUsers();
      } catch (err) {
        showMessage(friendlyError(err), true);
      }
    }

    async function loadUsers() {
      statusEl.textContent = "Loading...";
      statusEl.className = "muted";
      listEl.innerHTML = "";

      try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error(`Server responded with ${res.status}`);
        const users = await res.json();

        if (users.length === 0) {
          statusEl.textContent = "No users yet. Add one above.";
          return;
        }

        statusEl.textContent = "";
        for (const user of users) {
          const li = document.createElement("li");
          const text = document.createElement("span");
          text.textContent = `${user.name} (${user.email})`;

          const editBtn = document.createElement("button");
          editBtn.textContent = "Edit";
          editBtn.addEventListener("click", () => startEdit(user));

          const deleteBtn = document.createElement("button");
          deleteBtn.textContent = "Delete";
          deleteBtn.addEventListener("click", () => deleteUser(user));

          li.append(text, editBtn, deleteBtn);
          listEl.appendChild(li);
        }
      } catch (err) {
        statusEl.textContent = "Could not load users. Is the backend running on port 3000?";
        statusEl.className = "error";
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      showMessage("", false);

      const url = editingId ? `${API_URL}/${editingId}` : API_URL;
      const method = editingId ? "PUT" : "POST";

      try {
        const res = await fetch(url, {
          method,
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: nameInput.value, email: emailInput.value }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Request failed");

        showMessage(editingId ? `Updated ${data.name}` : `Added ${data.name}`, false);
        stopEdit();
        loadUsers();
      } catch (err) {
        showMessage(friendlyError(err), true);
      }
    });

    cancelBtn.addEventListener("click", () => {
      stopEdit();
      showMessage("", false);
    });

    loadUsers();
  </script>
</body>
</html>
